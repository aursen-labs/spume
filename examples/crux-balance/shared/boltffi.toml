[package]
name = "shared"
crate = "shared"
version = "0.1.0"

[targets.apple]
output = "../apple/generated/Shared"
include_macos = true

[targets.apple.swift]
module_name = "Shared"

[targets.apple.spm]
package_name = "Shared"
layout = "ffi-only"

[targets.android]
output = "../Android/generated"
min_sdk = 34

[targets.android.kotlin]
package = "dev.spume.balance"
output = "../Android/generated/kotlin"

[targets.android.pack]
output = "../Android/generated/jniLibs"
