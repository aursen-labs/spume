[package]
name = "spume"
version = "0.3.1"
edition = "2024"
description = "Lightweight, ergonomic Solana JSON-RPC wasm client"
license = "Apache-2.0"
repository = "https://github.com/aursen-labs/spume"
homepage = "https://github.com/aursen-labs/spume"
documentation = "https://docs.rs/spume"
readme = "README.md"
keywords = ["solana", "rpc", "wasm", "websocket", "json-rpc"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["rlib"]

[features]
default = ["http", "check_address"]
http = [
    "dep:futures",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
pubsub = ["http", "gloo-net/websocket"]
check_address = []

[dependencies]
futures = { version = "0.3", optional = true }
gloo-net = { version = "0.7.0", default-features = false, features = [
    "http",
    "json",
], optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
serde = "1"
serde_json = "1"
solana-address = "~2.6.1"
solana-epoch-info = { version = "3.1", features = ["serde"] }
solana-epoch-schedule = { version = "~3.2.0", features = ["serde"] }
solana-hash = "~4.4.0"
solana-reward-info = "~6.2.0"
solana-rpc-client-types = "~4.1.2"
solana-short-vec = "~3.2.2"
solana-signature = "~3.4.1"
solana-transaction-status-client-types = "4.1.2"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "AbortController",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WebSocket",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
solana-account-decoder-client-types = "4.1"
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
